<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Space Grotesk', system-ui, sans-serif;background:url("images/background.png") center / cover no-repeat fixed;color:#ffffff;-webkit-font-smoothing:antialiased}
.veil{min-height:100vh;background:rgba(0,0,0,0.30);padding:56px 20px 72px;display:flex;justify-content:center}
main{width:100%;max-width:520px;text-align:center}
.avatar{width:104px;height:104px;object-fit:cover;border-radius:24px;display:block;margin:0 auto 18px;border:2px solid color-mix(in oklab, #ffffff 25%, transparent)}
h1{font-size:34px;margin:0 0 8px;letter-spacing:-.02em;line-height:1.15}
.bio{color:#ffffff;margin:0 auto 28px;max-width:38ch;line-height:1.55;font-size:16px}
.links{display:flex;flex-direction:column;align-items:center;gap:12px}
.link{display:flex;align-items:center;gap:12px;text-decoration:none;border-radius:16px;background:color-mix(in oklab, #d1d1d1 16%, transparent);color:#d1d1d1;border:1px solid color-mix(in oklab, #d1d1d1 35%, transparent);backdrop-filter:blur(14px);font-weight:500;transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease;box-shadow:0 10px 26px -12px rgba(0,0,0,.6);}
.link:hover{transform:translateY(-3px);opacity:.96}
.link-0{padding:15px 18px;width:100%;}.link-0{animation-delay:0s}
.link-1{padding:15px 18px;width:100%;}.link-1{animation-delay:0.07s}
.link-2{padding:15px 18px;width:100%;}.link-2{animation-delay:0.14s}
.icon{font-size:1.15rem;line-height:1}
.link-text{display:flex;flex-direction:column;align-items:flex-start;gap:2px;flex:1;min-width:0;text-align:left}
.label{font-size:1rem}
.sub{font-size:.78rem;opacity:.7}
.chev{opacity:.55;font-size:.95rem}
.socials{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;margin-top:28px}
.socials a{color:#ffffff;text-decoration:none;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.socials a:hover{color:#ffffff}
.like{margin:26px auto 0;display:flex;align-items:center;gap:8px;background:transparent;border:1px solid color-mix(in oklab, #ffffff 25%, transparent);color:#ffffff;border-radius:999px;padding:9px 16px;font:inherit;font-size:.85rem;cursor:pointer;transition:transform .15s ease}
.like:active{transform:scale(.94)}
.like.on .heart{color:#ff5470}
.heart{transition:transform .2s ease}
.like.on .heart{transform:scale(1.25)}
footer{margin-top:34px;color:#ffffff;font-size:.75rem;opacity:.8}
@keyframes reveal{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.reveal,.link{animation:reveal 500ms cubic-bezier(.2,.7,.3,1) both}
.reveal:nth-of-type(1){animation-delay:.02s}
@media (prefers-reduced-motion: reduce){.reveal,.link{animation:none}}
</style>
</head>
<body>
<div class="veil">
  <main>
      <img class="avatar reveal" src="images/avatar.png" alt="Sioux Falls Iron Herd" />
      <h1 class="reveal">Sioux Falls Iron Herd</h1>

</p>

        <span class="icon">🐂</span>
        <span class="link-text">
          <span class="label">FACEBOOK</span>
          
        </span>
        <span class="chev">→</span>
      </a>
      <a class="link link-1" href="https://www.tiktok.com/@ironherdhc" target="_blank" rel="noopener noreferrer">
        <span class="icon">🔥</span>
        <span class="link-text">
          <span class="label">TIKTOK</span>
          
        </span>
        <span class="chev">→</span>
      </a>
      <a class="link link-2" href="https://www.instagram.com/ironherdhc" target="_blank" rel="noopener noreferrer">
        <span class="icon">📷</span>

      </div>
  </main>
</div>
<script>
(function(){
  var btn=document.getElementById('likeBtn');
  if(!btn)return;
  var out=document.getElementById('likeCount');
  var n=parseInt(localStorage.getItem('page-likes')||'0',10)||0;
  var mine=localStorage.getItem('page-liked')==='1';
  function paint(){out.textContent=n;btn.classList.toggle('on',mine);}
  paint();
  btn.addEventListener('click',function(){
    mine=!mine;n=Math.max(0,n+(mine?1:-1));
    localStorage.setItem('page-likes',String(n));
    localStorage.setItem('page-liked',mine?'1':'0');
    paint();
  });
})();
</script>
</body>
